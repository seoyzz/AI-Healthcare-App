version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pillsok
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - ./database:/docker-entrypoint-initdb.d  # schema.sql을 자동으로 실행함

  backend:
    build: ./server
    ports:
      - "5000:5000"
    depends_on:
      - db
